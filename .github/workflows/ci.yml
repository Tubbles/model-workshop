    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export camera arm STL
        run: |
          mkdir -p camera
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/camera-arm/scripts/export_camera_arm.py --pass camera
      - name: Upload camera arm STL
        uses: actions/upload-artifact@v4
        with:
          name: camera-arm-${{ env.SHORT_SHA }}
          path: camera/
          if-no-files-found: error
