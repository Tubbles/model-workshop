            freecadcmd model/kbdkid5/scripts/export_nano_bay_test.py --pass tray/kbdkid5_Nano_Bay_Test.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_clamp_tab.py --pass tray/kbdkid5_Nano_Clamp_Tab.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_tray.py --pass tray/kbdkid5_Tray_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_tray.py --pass tray/kbdkid5_Tray_Right.stl right
      - name: Upload tray, nano clamp tab and nano bay test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-tray-${{ env.SHORT_SHA }}
          path: tray/
          if-no-files-found: error

  kbdkid4-tray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kbdkid4-board
      - uses: ./.github/actions/freecad-image
      - name: Export tray STL
        run: |
          mkdir -p tray
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_tray.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/tray/kbdkid4_v1_Tray_Left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_tray.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/tray/kbdkid4_v1_Tray_Right.stl right
      - name: Upload tray STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-tray-${{ env.SHORT_SHA }}
          path: tray/
          if-no-files-found: error

  kbdkid4-plate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kbdkid4-board
      - uses: ./.github/actions/freecad-image
      - name: Export plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Right.stl right
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Left_Covered.stl covered
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Right_Covered.stl right covered
      - name: Upload plate STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-plate-${{ env.SHORT_SHA }}
          path: plate/
          if-no-files-found: error

  kbdkid4-pcb:
    runs-on: ubuntu-latest
