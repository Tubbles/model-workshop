name: CI

# A push or pull request that changes only markdown files and the
# license runs nothing: no script reads them, so every part would come
# out the same. A script that starts reading one must take it out of
# these lists.
on:
  push:
    paths-ignore:
      - "**.md"
      - LICENSE.txt
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE.txt
  workflow_dispatch:

permissions:
  contents: read

# One job per artifact, all in parallel, so a test print's STL is ready
# a few minutes after the push instead of waiting behind the other
# exports. Each job's name starts with its project's name, its
# directory under model/. Every export job restores or builds the
# FreeCAD image through .github/actions/freecad-image. The kbdkid4 jobs
# get kbdkid4's board through .github/actions/kbdkid4-board: the STEP
# that kbdkid4's latest successful CI run on main regenerated, and that
# run's commit checked out into external/kbdkid4, where the exports run,
# since the scripts read its board files relative to the working
# directory. A push to kbdkid4 does not run this workflow: once
# kbdkid4's own run has passed, run it by hand (workflow_dispatch).
env:
  # A pull request's github.sha is a merge commit, not the PR's head.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  kbdkid5-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the layout
        run: python3 model/kbdkid5/scripts/check_layout.py

  kbdkid5-socket-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export socket test STL
        run: |
          mkdir -p socket
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Socket_Test_Pocket.stl \
            pocket
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Socket_Test_Holes.stl \
            holes
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Socket_Test_Backing.stl \
            backing
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Switch_Hole_Test.stl \
            switch
      - name: Upload socket test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-socket-${{ env.SHORT_SHA }}
          path: socket/
          if-no-files-found: error

  kbdkid5-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export PCB mock STL
        run: |
          mkdir -p pcb
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Right.stl right
      - name: Upload PCB mock STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-pcb-${{ env.SHORT_SHA }}
          path: pcb/
          if-no-files-found: error
      - name: Export fused mock and slit test STL
        run: |
          mkdir -p mock
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_slit_test.py --pass mock/kbdkid5_Slit_Test.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_slit_test.py --pass mock/kbdkid5_Slit_Test_Wide.stl wide
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_mock.py --pass mock/kbdkid5_Mock_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_mock.py --pass mock/kbdkid5_Mock_Right.stl right
      - name: Upload fused mock and slit test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-mock-${{ env.SHORT_SHA }}
          path: mock/
          if-no-files-found: error

  kbdkid5-plate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export switch plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Left_Covered.stl covered
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Right_Covered.stl \
            right covered
      - name: Upload switch plate STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-plate-${{ env.SHORT_SHA }}
          path: plate/
          if-no-files-found: error

  kbdkid5-tray:
