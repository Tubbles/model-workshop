name: CI

# A push or pull request that changes only markdown files and the
# license runs nothing: no script reads them, so every part would come
# out the same. A script that starts reading one must take it out of
# these lists.
on:
  push:
    paths-ignore:
      - "**.md"
      - LICENSE.txt
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE.txt
  workflow_dispatch:

permissions:
  contents: read

# A keyboard's STLs end up in two artifacts, its parts in
# <project>-<short commit hash> and its test prints and mocks, every STL
# whose name says test or mock, in <project>-test-<short commit hash>.
# Every other project's end up in one, <project>-<short commit hash>
# (README.md, Getting the STLs). Each job's name starts with its
# project's name, its directory under model/. A keyboard's exports are
# split over several jobs, so they build in parallel, and each job's
# STLs are all parts or all tests. Each uploads its STLs once, at its
# end, as an intermediate artifact,
# <project>-part-<kind>-<short commit hash> or
# <project>-test-<kind>-<short commit hash>, and the job named after the
# group's artifact (kbdkid5, kbdkid5-test, kbdkid4) merges the group's
# intermediates into it and deletes them. A group whose STLs all come
# from one job, as kbdkid4's PCB mocks do, is uploaded by that job
# straight under the group's artifact name, with no merge. A merge needs
# only its group's export jobs and runs only when every one of them
# passed, so a failed test export does not hold back the parts. After a
# failed one the group's intermediates stay on the run page, and
# rerunning the failed jobs reruns the merge too, so a run ends with one
# artifact per group, never an earlier attempt's partial one beside it.
# A job that uploaded twice would leave its first artifact behind after
# a rerun, since the merge deletes one artifact per name. A merge's
# pattern, <project>-part-*-<short commit hash> or
# <project>-test-*-<short commit hash>, needs a kind before the hash, so
# it matches its own group's intermediates only, never a merged artifact
# or the other group's. The merge puts every file in one folder, where a
# file replaces another of the same name, so no two STLs of a group may
# share a name. Every
# export job restores or builds the FreeCAD image through
# .github/actions/freecad-image. The kbdkid4 jobs get kbdkid4's board
# through .github/actions/kbdkid4-board: the STEP that kbdkid4's
# latest successful CI run on main regenerated, and that run's commit
# checked out into external/kbdkid4, where the exports run, since the
# scripts read its board files relative to the working directory. A
# push to kbdkid4 does not run this workflow: once kbdkid4's own run
# has passed, run it by hand (workflow_dispatch).
env:
  # A pull request's github.sha is a merge commit, not the PR's head.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  kbdkid5-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the layout
        run: python3 model/kbdkid5/scripts/check_layout.py

  # Not a project's: the placement solver's tests (tools/placement/)
  # and kbdkid5's runs of it, which read check_layout.py's rules.
  placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the placement image
        run: docker build -t placement -f docker/placement.Dockerfile docker
      - name: Test the solver
        run: |
          docker run --rm -v "$PWD":/work -w /work placement \
            python3 -B -m unittest discover -s tools/placement/tests -t tools
      - name: Test kbdkid5's placements
        run: |
          docker run --rm -v "$PWD":/work -w /work placement \
            python3 -B model/kbdkid5/scripts/test_place.py

  kbdkid5-socket-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export socket test STL
        run: |
          mkdir -p socket
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5-socket-test-pocket.stl \
            pocket
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5-socket-test-holes.stl \
            holes
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5-socket-test-backing.stl \
            backing
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5-switch-hole-test.stl \
            switch
      - name: Upload socket test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-test-socket-${{ env.SHORT_SHA }}
          path: socket/
          if-no-files-found: error

  kbdkid5-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export hand-wired frame and backing STL
        run: |
          mkdir -p frame
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_frame.py --pass frame/kbdkid5-frame-left.stl frame
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_frame.py --pass frame/kbdkid5-frame-right.stl frame right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_frame.py --pass frame/kbdkid5-frame-backing-left.stl \
            backing
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_frame.py --pass frame/kbdkid5-frame-backing-right.stl \
            backing right
      - name: Upload hand-wired frame and backing STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-part-frame-${{ env.SHORT_SHA }}
          path: frame/
          if-no-files-found: error

  kbdkid5-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export PCB mock, fused mock and slit test STL
        run: |
          mkdir -p mock
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_pcb.py --pass mock/kbdkid5-pcb-mock-left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_pcb.py --pass mock/kbdkid5-pcb-mock-right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_slit_test.py --pass mock/kbdkid5-slit-test.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_slit_test.py --pass mock/kbdkid5-slit-test-wide.stl wide
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_mock.py --pass mock/kbdkid5-fused-mock-left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_mock.py --pass mock/kbdkid5-fused-mock-right.stl right
      - name: Upload PCB mock, fused mock and slit test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-test-mock-${{ env.SHORT_SHA }}
          path: mock/
          if-no-files-found: error

  kbdkid5-plate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export switch plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5-plate-left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5-plate-right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5-plate-covered-left.stl covered
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_plate.py --pass plate/kbdkid5-plate-covered-right.stl \
            right covered
      - name: Upload switch plate STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-part-plate-${{ env.SHORT_SHA }}
          path: plate/
          if-no-files-found: error

  kbdkid5-tray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export tray, nano clamp tab and power switch retainer STL
        run: |
          mkdir -p tray
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_clamp_tab.py --pass tray/kbdkid5-nano-clamp-tab.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_power_switch_retainer.py --pass tray/kbdkid5-power-switch-retainer.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_tray.py --pass tray/kbdkid5-tray-left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_tray.py --pass tray/kbdkid5-tray-right.stl right
      - name: Upload tray, nano clamp tab and power switch retainer STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-part-tray-${{ env.SHORT_SHA }}
          path: tray/
          if-no-files-found: error

  kbdkid5-nano-bay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export nano bay test STL
        run: |
          mkdir -p bay
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/kbdkid5/scripts/export_nano_bay_test.py --pass bay/kbdkid5-nano-bay-test.stl
      - name: Upload nano bay test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-test-nano-bay-${{ env.SHORT_SHA }}
          path: bay/
          if-no-files-found: error

  kbdkid5:
    runs-on: ubuntu-latest
    needs: [kbdkid5-frame, kbdkid5-plate, kbdkid5-tray]
    steps:
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - name: Merge kbdkid5's part STL into one artifact
        uses: actions/upload-artifact/merge@v4
        with:
          name: kbdkid5-${{ env.SHORT_SHA }}
          pattern: kbdkid5-part-*-${{ env.SHORT_SHA }}
          delete-merged: true

  kbdkid5-test:
    runs-on: ubuntu-latest
    needs: [kbdkid5-socket-test, kbdkid5-mock, kbdkid5-nano-bay-test]
    steps:
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - name: Merge kbdkid5's test and mock STL into one artifact
        uses: actions/upload-artifact/merge@v4
        with:
          name: kbdkid5-test-${{ env.SHORT_SHA }}
          pattern: kbdkid5-test-*-${{ env.SHORT_SHA }}
          delete-merged: true

  kbdkid4-tray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kbdkid4-board
      - uses: ./.github/actions/freecad-image
      - name: Export tray STL
        run: |
          mkdir -p tray
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_tray.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/tray/kbdkid4-tray-left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_tray.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/tray/kbdkid4-tray-right.stl right
      - name: Upload tray STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-part-tray-${{ env.SHORT_SHA }}
          path: tray/
          if-no-files-found: error

  kbdkid4-plate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kbdkid4-board
      - uses: ./.github/actions/freecad-image
      - name: Export plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4-plate-left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4-plate-right.stl right
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4-plate-covered-left.stl covered
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_plate.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4-plate-covered-right.stl right covered
      - name: Upload plate STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-part-plate-${{ env.SHORT_SHA }}
          path: plate/
          if-no-files-found: error

  kbdkid4-pcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kbdkid4-board
      - uses: ./.github/actions/freecad-image
      - name: Export PCB replica STL
        run: |
          mkdir -p pcb
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_pcb.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/pcb/kbdkid4-pcb-mock-left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_pcb.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/pcb/kbdkid4-pcb-mock-right.stl right
      - name: Upload PCB replica STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-test-${{ env.SHORT_SHA }}
          path: pcb/
          if-no-files-found: error

  kbdkid4-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kbdkid4-board
      - uses: ./.github/actions/freecad-image
      - name: Export case STL
        run: |
          mkdir -p case
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_case.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/case/kbdkid4-case-left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_case.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/case/kbdkid4-case-right.stl right
      - name: Upload case STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-part-case-${{ env.SHORT_SHA }}
          path: case/
          if-no-files-found: error

  kbdkid4:
    runs-on: ubuntu-latest
    needs: [kbdkid4-tray, kbdkid4-plate, kbdkid4-case]
    steps:
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - name: Merge kbdkid4's part STL into one artifact
        uses: actions/upload-artifact/merge@v4
        with:
          name: kbdkid4-${{ env.SHORT_SHA }}
          pattern: kbdkid4-part-*-${{ env.SHORT_SHA }}
          delete-merged: true

  solder-spool-axle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export solder spool axle STL
        run: |
          mkdir -p spool
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/solder-spool-axle/scripts/export_spool_axle.py --pass spool/solder-spool-axle.stl
      - name: Upload solder spool axle STL
        uses: actions/upload-artifact@v4
        with:
          name: solder-spool-axle-${{ env.SHORT_SHA }}
          path: spool/
          if-no-files-found: error

  camera-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export camera arm STL
        run: |
          mkdir -p camera
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd model/camera-arm/scripts/export_camera_arm.py --pass camera
      - name: Upload camera arm STL
        uses: actions/upload-artifact@v4
        with:
          name: camera-arm-${{ env.SHORT_SHA }}
          path: camera/
          if-no-files-found: error
