            freecadcmd /work/model/kbdkid4/scripts/export_pcb.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/pcb/kbdkid4_v1_Pcb_Left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/model/kbdkid4/scripts/export_pcb.py --pass /work/external/kbdkid4-outputs/kbdkid4/kbdkid4_v1.step \
            /work/pcb/kbdkid4_v1_Pcb_Right.stl right
      - name: Upload PCB replica STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-pcb-${{ env.SHORT_SHA }}
          path: pcb/
          if-no-files-found: error

  kbdkid4-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/kbdkid4-board
      - uses: ./.github/actions/freecad-image
