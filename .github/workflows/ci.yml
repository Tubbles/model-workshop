name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One job per artifact, all in parallel, so a test print's STL is ready
# a few minutes after the push instead of waiting behind the other
# exports. Each job's name starts with its project's directory. Every
# export job restores or builds the FreeCAD image through
# .github/actions/freecad-image. The kbdkid4 jobs check out
# Tubbles/kbdkid4's default branch into external/kbdkid4 and run the
# exports there, since the scripts read its board files relative to the
# working directory. A push to kbdkid4 does not run this workflow: run
# it by hand (workflow_dispatch) to export from kbdkid4's latest board.
env:
  # A pull request's github.sha is a merge commit, not the PR's head.
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  kbdkid5-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the layout
        run: python3 kbdkid5/scripts/check_layout.py

  kbdkid5-socket-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export socket test STL
        run: |
          mkdir -p socket
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Socket_Test_Pocket.stl \
            pocket
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Socket_Test_Holes.stl \
            holes
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Socket_Test_Backing.stl \
            backing
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_socket_test.py --pass socket/kbdkid5_Switch_Hole_Test.stl \
            switch
      - name: Upload socket test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-socket-stl-${{ env.SHORT_SHA }}
          path: socket/
          if-no-files-found: error

  kbdkid5-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export PCB mock STL
        run: |
          mkdir -p pcb
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Right.stl right
      - name: Upload PCB mock STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-pcb-stl-${{ env.SHORT_SHA }}
          path: pcb/
          if-no-files-found: error
      - name: Export fused mock and slit test STL
        run: |
          mkdir -p mock
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_slit_test.py --pass mock/kbdkid5_Slit_Test.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_slit_test.py --pass mock/kbdkid5_Slit_Test_Wide.stl wide
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_mock.py --pass mock/kbdkid5_Mock_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_mock.py --pass mock/kbdkid5_Mock_Right.stl right
      - name: Upload fused mock and slit test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-mock-stl-${{ env.SHORT_SHA }}
          path: mock/
          if-no-files-found: error

  kbdkid5-plate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export switch plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Left_Covered.stl covered
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_plate.py --pass plate/kbdkid5_Plate_Right_Covered.stl \
            right covered
      - name: Upload switch plate STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-plate-stl-${{ env.SHORT_SHA }}
          path: plate/
          if-no-files-found: error

  kbdkid5-tray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export tray, nano clamp tab and nano bay test STL
        run: |
          mkdir -p tray
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_nano_bay_test.py --pass tray/kbdkid5_Nano_Bay_Test.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_clamp_tab.py --pass tray/kbdkid5_Nano_Clamp_Tab.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_tray.py --pass tray/kbdkid5_Tray_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd kbdkid5/scripts/export_tray.py --pass tray/kbdkid5_Tray_Right.stl right
      - name: Upload tray, nano clamp tab and nano bay test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-tray-stl-${{ env.SHORT_SHA }}
          path: tray/
          if-no-files-found: error

  kbdkid4-tray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - name: Check out kbdkid4's board files
        uses: actions/checkout@v4
        with:
          repository: Tubbles/kbdkid4
          path: external/kbdkid4
      - uses: ./.github/actions/freecad-image
      - name: Export tray STL
        run: |
          mkdir -p tray
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_tray.py --pass output/v1/kbdkid4_v1.step \
            /work/tray/kbdkid4_v1_Tray_Left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_tray.py --pass output/v1/kbdkid4_v1.step \
            /work/tray/kbdkid4_v1_Tray_Right.stl right
      - name: Upload tray STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-tray-stl-${{ env.SHORT_SHA }}
          path: tray/
          if-no-files-found: error

  kbdkid4-plate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - name: Check out kbdkid4's board files
        uses: actions/checkout@v4
        with:
          repository: Tubbles/kbdkid4
          path: external/kbdkid4
      - uses: ./.github/actions/freecad-image
      - name: Export plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_plate.py --pass output/v1/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_plate.py --pass output/v1/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Right.stl right
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_plate.py --pass output/v1/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Left_Covered.stl covered
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_plate.py --pass output/v1/kbdkid4_v1.step \
            /work/resources/kbdkid3-plate-left.FCStd /work/plate/kbdkid4_v1_Plate_Right_Covered.stl right covered
      - name: Upload plate STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-plate-stl-${{ env.SHORT_SHA }}
          path: plate/
          if-no-files-found: error

  kbdkid4-pcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - name: Check out kbdkid4's board files
        uses: actions/checkout@v4
        with:
          repository: Tubbles/kbdkid4
          path: external/kbdkid4
      - uses: ./.github/actions/freecad-image
      - name: Export PCB replica STL
        run: |
          mkdir -p pcb
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_pcb.py --pass output/v1/kbdkid4_v1.step \
            /work/pcb/kbdkid4_v1_Pcb_Left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_pcb.py --pass output/v1/kbdkid4_v1.step \
            /work/pcb/kbdkid4_v1_Pcb_Right.stl right
      - name: Upload PCB replica STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-pcb-stl-${{ env.SHORT_SHA }}
          path: pcb/
          if-no-files-found: error

  kbdkid4-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - name: Check out kbdkid4's board files
        uses: actions/checkout@v4
        with:
          repository: Tubbles/kbdkid4
          path: external/kbdkid4
      - uses: ./.github/actions/freecad-image
      - name: Export case STL
        run: |
          mkdir -p case
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_case.py --pass output/v1/kbdkid4_v1.step \
            /work/case/kbdkid4_v1_Case_Left.stl
          docker run --rm -v "$PWD":/work -w /work/external/kbdkid4 freecad-headless \
            freecadcmd /work/kbdkid4/scripts/export_case.py --pass output/v1/kbdkid4_v1.step \
            /work/case/kbdkid4_v1_Case_Right.stl right
      - name: Upload case STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid4-case-stl-${{ env.SHORT_SHA }}
          path: case/
          if-no-files-found: error

  solder-spool-axle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export solder spool axle STL
        run: |
          mkdir -p spool
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd solder-spool-axle/scripts/export_spool_axle.py --pass spool/Solder_Spool_Axle.stl
      - name: Upload solder spool axle STL
        uses: actions/upload-artifact@v4
        with:
          name: solder-spool-axle-stl-${{ env.SHORT_SHA }}
          path: spool/
          if-no-files-found: error

  camera-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/freecad-image
      - name: Export camera arm STL
        run: |
          mkdir -p camera
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd camera-arm/scripts/export_camera_arm.py --pass camera
      - name: Upload camera arm STL
        uses: actions/upload-artifact@v4
        with:
          name: camera-arm-stl-${{ env.SHORT_SHA }}
          path: camera/
          if-no-files-found: error
